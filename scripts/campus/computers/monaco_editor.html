<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campus Code Editor</title>
<style>
html, body, #code { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #061d2c; }
</style>
<script src="vs/loader.js"></script>
</head>
<body>
<div id="code" aria-label="Source code"></div>
<script>
require.config({ paths: { vs: "./vs" } });
require(["vs/editor/editor.main"], function () {
    const models = new Map();
    let update;
    let dirty = false;
    let syncing = false;
    let documentId = "";
    let wireToken = "";
    monaco.editor.defineTheme("campus", {
        base: "vs-dark", inherit: true, rules: [],
        colors: {
            "editor.background": "#061D2C",
            "editorLineNumber.foreground": "#7699A9",
            "editor.lineHighlightBackground": "#10354A",
            "editor.selectionBackground": "#21556D",
            "editorWidget.background": "#102C3E",
            "editorSuggestWidget.border": "#36677B"
        }
    });
    const editor = monaco.editor.create(document.getElementById("code"), {
        theme: "campus", model: null, automaticLayout: true, tabSize: 4,
        minimap: { enabled: false }, links: false, scrollBeyondLastLine: false,
        quickSuggestions: { other: true, comments: false, strings: false },
        wordBasedSuggestions: "currentDocument"
    });
    const keywords = {
        python: "and as assert async await break class continue def del elif else except False finally for from global if import in is lambda match None nonlocal not or pass raise return True try while with yield print range len enumerate",
        c: "auto break case char const continue default do double else enum extern float for goto if int long register return short signed sizeof static struct switch typedef union unsigned void volatile while",
        cpp: "auto bool break case catch char class concept const constexpr continue decltype default delete do else enum explicit float for if inline int namespace new noexcept nullptr private protected public return static struct switch template this throw try using virtual void while",
        csharp: "abstract async await bool break case catch class const continue default delegate else enum event false for foreach if int interface namespace new null override private protected public readonly record return sealed static struct switch true try using var void while yield",
        java: "abstract boolean break byte case catch char class continue default double else enum extends final finally float for if implements import instanceof int interface long new null package private protected public return static super switch this throw throws try var void while",
        rust: "as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where while",
        go: "break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var",
        lua: "and break do else elseif end false for function goto if in local nil not or repeat return then true until while",
        ruby: "alias and begin break case class def defined do else elsif end ensure false for if in module next nil not or redo rescue retry return self super then true undef unless until when while yield",
        php: "abstract array break call class const continue declare default do echo else elseif empty enum extends final fn for foreach function if implements include interface isset match namespace new null private protected public require return static switch throw trait try use while yield",
        kotlin: "as break class companion constructor continue data else enum false for fun if import in interface is null object open override package private public return sealed super this throw true try typealias val var when while",
        sql: "ALTER AS ASC BEGIN BY CASE COMMIT CREATE DELETE DESC DISTINCT DROP ELSE END FROM GROUP HAVING INSERT INTO JOIN LIMIT NOT NULL OFFSET ON ORDER PRIMARY SELECT SET TABLE THEN UNION UPDATE VALUES WHERE WITH"
    };
    for (const [language, words] of Object.entries(keywords)) {
        monaco.languages.registerCompletionItemProvider(language, {
            provideCompletionItems(model, position) {
                const word = model.getWordUntilPosition(position);
                const range = new monaco.Range(position.lineNumber, word.startColumn, position.lineNumber, word.endColumn);
                return { suggestions: words.split(" ").map(label => ({
                    label, insertText: label, kind: monaco.languages.CompletionItemKind.Keyword, range
                })) };
            }
        });
    }
    function bytesToBase64(text) {
        const bytes = new TextEncoder().encode(text);
        let encoded = "";
        for (let i = 0; i < bytes.length; i += 2048) encoded += String.fromCharCode(...bytes.slice(i, i + 2048));
        return btoa(encoded);
    }
    function publish(kind) {
        const source = editor.getValue();
        const send = window.godotMethods?.campus_monaco_report;
        if (!send) return;
        if (new TextEncoder().encode(source).length > 32768) {
            send(JSON.stringify({ token: wireToken, id: documentId, kind: "limit" }));
            return;
        }
        dirty = false;
        send(JSON.stringify({ token: wireToken, id: documentId, kind, text: bytesToBase64(source) }));
    }
    window.campusSource = (id, path, language, value, token) => {
        if (dirty && editor.getModel()) publish("edit");
        clearTimeout(update);
        syncing = true;
        wireToken = token;
        documentId = id;
        let record = models.get(id);
        if (!record) {
            if (models.size >= 12) {
                const oldest = [...models.keys()].find(key => models.get(key).model !== editor.getModel());
                models.get(oldest).model.dispose();
                models.delete(oldest);
            }
            const uri = monaco.Uri.from({ scheme: "campus", path: "/" + (path || "untitled.txt") });
            const model = monaco.editor.getModel(uri) || monaco.editor.createModel(value, language, uri);
            model.updateOptions({ tabSize: 4, insertSpaces: true });
            record = { model, state: null };
            models.set(id, record);
        }
        const previous = [...models.values()].find(record => record.model === editor.getModel());
        if (previous && previous !== record) previous.state = editor.saveViewState();
        if (record.model.getLanguageId() !== language) monaco.editor.setModelLanguage(record.model, language);
        editor.setModel(record.model);
        if (record.state) editor.restoreViewState(record.state);
        syncing = false;
        dirty = false;
    };
    window.campusEditorAction = name => editor.trigger("campus", name, null);
    window.campusEditorLanguage = language => {
        if (editor.getModel()) monaco.editor.setModelLanguage(editor.getModel(), language);
    };
    editor.onDidChangeModelContent(() => {
        if (syncing) return;
        dirty = true;
        clearTimeout(update);
        update = setTimeout(() => publish("edit"), 90);
    });
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => publish("save"));
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => publish("run"));
    window.campusEditorFocus = () => editor.focus();
    window.campusSubmitSource = publish;
    document.title = "Campus editor ready";
});
</script>
</body>
</html>
