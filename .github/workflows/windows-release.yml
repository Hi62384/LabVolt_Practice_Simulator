name: Publish Windows game

on:
  push:
    branches: [windows-launcher]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-game-channel
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify CEF LFS objects
        shell: pwsh
        run: |
          git lfs pull
          if ($LASTEXITCODE) { throw 'Git LFS download failed' }
          git lfs fsck
          if ($LASTEXITCODE) { throw 'Git LFS object verification failed' }
          foreach ($file in @('cef_artifacts/windows/libgdcef.dll', 'cef_artifacts/windows/libcef.dll')) {
            $stream = [IO.File]::OpenRead((Join-Path $PWD $file))
            try {
              $reader = [IO.BinaryReader]::new($stream)
              if ($stream.Length -lt 1024 -or $reader.ReadUInt16() -ne 0x5a4d) { throw "$file is not a Windows PE binary (possibly an LFS pointer)" }
              $stream.Position = 0x3c
              $offset = $reader.ReadInt32()
              if ($offset -lt 0 -or $offset + 6 -gt $stream.Length) { throw "$file has an invalid PE header" }
              $stream.Position = $offset
              if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0x8664) { throw "$file is not an x86-64 PE binary" }
            } finally { $stream.Dispose() }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install Godot and Windows export template
        shell: pwsh
        run: |
          $engineDir = "$env:RUNNER_TEMP/godot"
          $templates = "$env:APPDATA/Godot/export_templates/$env:GODOT_VERSION.stable.mono"
          New-Item -ItemType Directory -Force $engineDir,$templates | Out-Null
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          $engine = "Godot_v$env:GODOT_VERSION-stable_mono_win64"
          curl.exe --fail --location --retry 3 --output "$engineDir/engine.zip" "$base/$engine.zip"
          if ($LASTEXITCODE) { throw 'Godot download failed' }
          Expand-Archive -Path "$engineDir/engine.zip" -DestinationPath $engineDir
          curl.exe --fail --location --retry 3 --output "$engineDir/templates.tpz" "$base/Godot_v$env:GODOT_VERSION-stable_mono_export_templates.tpz"
          if ($LASTEXITCODE) { throw 'Godot templates download failed' }
          tar.exe -xf "$engineDir/templates.tpz" -C $templates --strip-components 1 templates/version.txt templates/windows_debug_x86_64.exe templates/windows_release_x86_64.exe
          if ($LASTEXITCODE) { throw 'Windows export template extraction failed' }
          "GODOT=$engineDir/$engine/$($engine)_console.exe" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bundle the Cloudflare account tools
        shell: pwsh
        run: |
          npm install --prefix relay --no-save --no-package-lock wrangler@4.158.0 @napi-rs/keyring@1.3.0
          if ($LASTEXITCODE) { throw 'Wrangler install failed' }
          $tools = "$env:RUNNER_TEMP/relay-tools"
          New-Item -ItemType Directory -Force $tools | Out-Null
          Copy-Item (Get-Command node.exe).Source "$tools/node.exe"
          Copy-Item relay/account.mjs,relay/worker.mjs,relay/wrangler.jsonc $tools
          Copy-Item relay/node_modules "$tools/node_modules" -Recurse
          Compress-Archive -Path "$tools/*" -DestinationPath relay/relay-tools-4.158.0.zip
          $relay = Start-Process node.exe -ArgumentList 'relay/node_modules/wrangler/bin/wrangler.js dev --config relay/wrangler.jsonc --ip 127.0.0.1 --port 8787' -WindowStyle Hidden -PassThru
          for ($i = 0; $i -lt 60; $i++) {
            if ($relay.HasExited) { throw 'Local relay exited' }
            try {
              if ((Invoke-RestMethod http://127.0.0.1:8787/health -TimeoutSec 2) -eq 'LabVolt relay v1') { break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if ($i -eq 60) { throw 'Local relay did not start' }
          'LABVOLT_RELAY_URL=ws://127.0.0.1:8787' >> $env:GITHUB_ENV
      - name: Verify Play and export Windows game
        shell: pwsh
        run: |
          $game = "$env:RUNNER_TEMP/game"
          New-Item -ItemType Directory -Force $game | Out-Null
          dotnet restore CollegeSimulator.sln
          if ($LASTEXITCODE) { throw 'C# restore failed' }
          dotnet build CollegeSimulator.sln --configuration Debug --no-restore
          if ($LASTEXITCODE) { throw 'C# build failed' }
          if (!(Test-Path '.godot/mono/temp/bin/Debug/CollegeSimulator.dll')) { throw 'Missing Godot source-project Debug assembly' }
          & $env:GODOT --headless --path . --import
          if ($LASTEXITCODE) { throw 'Godot import failed' }
          $originalAppData = $env:APPDATA
          $env:APPDATA = "$env:RUNNER_TEMP/menu-smoke-source"
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $sourceLog = "$env:RUNNER_TEMP/source-play.log"
          & $env:GODOT --headless --path . --script res://tests/menu_startup/test_menu_routes.gd --log-file $sourceLog
          if ($LASTEXITCODE -or !(Test-Path $sourceLog) -or !(Select-String -Path $sourceLog -SimpleMatch 'MENU_ROUTES PASS') -or (Select-String -Path $sourceLog -Pattern 'SCRIPT ERROR:')) { throw 'Source Play route verification failed' }
          $sourceTests = @{
            test_mna_csharp_kernel = 'MNA_CSHARP_KERNEL PASS'
            test_catalogue_audit = 'CATALOGUE_AUDIT PASS'
          }
          foreach ($test in $sourceTests.Keys) {
            $sourceLog = "$env:RUNNER_TEMP/$test.log"
            & $env:GODOT --headless --path . --script "res://tests/electronics/$test.gd" --log-file $sourceLog
            if ($LASTEXITCODE -or !(Test-Path $sourceLog) -or !(Select-String -Path $sourceLog -SimpleMatch $sourceTests[$test]) -or (Select-String -Path $sourceLog -Pattern 'SCRIPT ERROR:')) { throw "Source test failed: $test" }
          }
          $env:APPDATA = $originalAppData
          & $env:GODOT --headless --path . --export-release "Windows Desktop" "$game/LabVolt.exe"
          if ($LASTEXITCODE -or !(Test-Path "$game/LabVolt.pck") -or !(Test-Path "$game/data_CollegeSimulator_windows_x86_64/CollegeSimulator.dll")) { throw 'Windows .NET export failed' }
          $smoke = Join-Path $PWD 'tests/menu_startup/test_menu_routes.gd'
          $log = "$env:RUNNER_TEMP/exported-play.log"
          $env:APPDATA = "$env:RUNNER_TEMP/menu-smoke-export"
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $menuArgs = @('--headless','--path',('"' + $game + '"'),'--script',('"' + $smoke + '"'),'--log-file',('"' + $log + '"'))
          $menuRun = Start-Process -FilePath "$game/LabVolt.exe" -ArgumentList $menuArgs -WindowStyle Hidden -Wait -PassThru
          if ($menuRun.ExitCode -or !(Test-Path $log) -or !(Select-String -Path $log -SimpleMatch 'MENU_ROUTES PASS') -or (Select-String -Path $log -Pattern 'ERROR:' | Where-Object { $_.Line -notlike '*Failed to read the root certificate store*' })) { throw 'Exported game failed Play verification' }
          $kernelLog = "$env:RUNNER_TEMP/exported-solver.log"
          $kernelTest = (Resolve-Path 'tests/electronics/test_mna_csharp_kernel.gd').Path
          $kernelArgs = @('--headless','--path',('"' + $game + '"'),'--script',('"' + $kernelTest + '"'),'--log-file',('"' + $kernelLog + '"'))
          $kernelRun = Start-Process -FilePath "$game/LabVolt.exe" -ArgumentList $kernelArgs -WindowStyle Hidden -Wait -PassThru
          if ($kernelRun.ExitCode -or !(Select-String -Path $kernelLog -SimpleMatch 'MNA_CSHARP_KERNEL PASS' -Quiet)) { throw 'Exported C# circuit solver failed' }
      - name: Bundle offline instructor voices
        shell: pwsh
        run: |
          $game = "$env:RUNNER_TEMP/game"
          ./scripts/campus/academics/package_windows_voices.ps1 -GameDirectory $game
          $env:APPDATA = "$env:RUNNER_TEMP/teacher-voice-test"
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $log = "$env:RUNNER_TEMP/teacher-voice-test.log"
          $test = (Resolve-Path 'tests/campus/academics/test_real_teacher_voices.gd').Path
          $voiceArgs = @('--headless','--path',('"' + $game + '"'),'--script',('"' + $test + '"'),'--log-file',('"' + $log + '"'))
          $voiceTest = Start-Process -FilePath "$game/LabVolt.exe" -ArgumentList $voiceArgs -WindowStyle Hidden -Wait -PassThru
          if ($voiceTest.ExitCode -or !(Test-Path $log) -or !(Select-String -Path $log -SimpleMatch 'REAL_TEACHER_VOICES PASS' -Quiet)) { throw 'Exported instructor voices failed synthesis verification' }
      - name: Bundle and verify offline firmware compilers
        shell: pwsh
        run: |
          $game = "$env:RUNNER_TEMP/game"
          ./scripts/firmware_toolchain/package_windows.ps1 -GameDirectory $game
          if ($LASTEXITCODE) { throw 'Native compiler packaging failed' }
          $install = Join-Path $env:LOCALAPPDATA 'LabVolt/FirmwareToolchain'
          & powershell.exe -NoProfile -NonInteractive -File "$game/firmware_toolchain/install_bundled.ps1" -GameDirectory $game -InstallRoot $install
          if ($LASTEXITCODE) { throw 'Native compiler acceptance failed' }
          $script = (Resolve-Path 'tests/firmware_toolchain/test_compile_service.gd').Path
          foreach ($board in @('uno','nano','pico')) {
            $env:LABVOLT_TEST_BOARD = $board
            $log = "$env:RUNNER_TEMP/firmware-$board.log"
            $args = @('--headless','--path',('"' + $game + '"'),'--main-pack',('"' + "$game/LabVolt.pck" + '"'),'--script',('"' + $script + '"'),'--log-file',('"' + $log + '"'))
            $test = Start-Process -FilePath "$game/LabVolt.exe" -ArgumentList $args -WindowStyle Hidden -Wait -PassThru
            if ($test.ExitCode -or !(Select-String -Path $log -SimpleMatch "FIRMWARE_COMPILE PASS $board" -Quiet)) { throw "Exported $board compiler test failed" }
          }
      - name: Build launcher and package the game
        shell: pwsh
        run: |
          $assets = "$env:RUNNER_TEMP/release"
          python launcher/test_updates.py
          if ($LASTEXITCODE) { throw 'Launcher update verification failed' }
          $version = "$env:GITHUB_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python launcher/package.py "$env:RUNNER_TEMP/game" $assets $version
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          ./launcher/build.ps1 -Output "$assets/LabVoltLauncher.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-windows-package
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 3
  release:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-windows-package
          path: ${{ runner.temp }}/release
      - name: Publish the verified release
        shell: pwsh
        run: |
          $manifest = Get-Content "$env:RUNNER_TEMP/release/manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.version -notmatch "^$env:GITHUB_SHA-$env:GITHUB_RUN_ID-[0-9]+$") { throw 'Package version does not belong to this run' }
          $tag = "game-$($manifest.version)"
          $env:GH_REPO = $env:GITHUB_REPOSITORY
          $endpoint = "repos/$env:GITHUB_REPOSITORY/releases"
          $files = @(Get-ChildItem "$env:RUNNER_TEMP/release" -File)
          $expected = @{ 'manifest.json' = $true; 'LabVoltLauncher.exe' = $true }
          foreach ($entry in $manifest.files) {
            foreach ($block in $entry.blocks) { $expected["$($block.sha256).gz"] = $true }
          }
          if ($files.Count -ne $expected.Count -or ($files | Group-Object Name | Where-Object Count -gt 1) -or ($files | Where-Object { !$expected.ContainsKey($_.Name) })) { throw 'Packaged release assets differ from the manifest' }
          $hashes = @{}
          foreach ($file in $files) { $hashes[$file.Name] = 'sha256:' + (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          $releasePages = gh api --paginate --slurp $endpoint
          if ($LASTEXITCODE) { throw 'Could not inspect existing releases' }
          $release = foreach ($page in (ConvertFrom-Json -InputObject ($releasePages -join "`n") -NoEnumerate)) {
            $page | Where-Object tag_name -eq $tag
          }
          if (!$release) {
            $releaseJson = gh api $endpoint --method POST -f "tag_name=$tag" -f "target_commitish=$env:GITHUB_SHA" -F draft=true -f "name=College Simulator Windows build $env:GITHUB_RUN_NUMBER" -f "body=Download LabVoltLauncher.exe once. It installs College Simulator and checks for future updates on startup." --jq '{id,draft}'
            if ($LASTEXITCODE) { throw 'Could not create draft release' }
            $release = $releaseJson | ConvertFrom-Json
          }
          $releaseId = $release.id
          function Get-ReleaseAssets {
            $json = gh api --paginate --slurp "$endpoint/$releaseId/assets"
            if ($LASTEXITCODE) { throw 'Could not list release assets' }
            foreach ($page in (ConvertFrom-Json -InputObject ($json -join "`n") -NoEnumerate)) {
              foreach ($asset in $page) { $asset }
            }
          }
          $assets = @{}
          foreach ($asset in (Get-ReleaseAssets)) { $assets[$asset.name] = $asset }
          $pending = @()
          foreach ($file in $files) {
            $asset = $assets[$file.Name]
            if ($asset.state -eq 'uploaded' -and $asset.size -eq $file.Length -and $asset.digest -eq $hashes[$file.Name]) { continue }
            if (!$release.draft) { throw "Published release differs from the verified package: $($file.Name)" }
            if ($asset) {
              gh api "$endpoint/assets/$($asset.id)" --method DELETE
              if ($LASTEXITCODE) { throw "Could not remove interrupted draft asset: $($file.Name)" }
            }
            $pending += $file.FullName
          }
          for ($i = 0; $i -lt $pending.Count; $i += 40) {
            $batch = @($pending[$i..([Math]::Min($i + 39, $pending.Count - 1))])
            for ($retry = 0; $retry -lt 3 -and $batch.Count; $retry++) {
              gh release upload $tag @batch
              if (!$LASTEXITCODE) { $batch = @(); break }
              # A request can fail after GitHub accepted the asset. Compare the actual draft.
              $received = @{}
              foreach ($asset in (Get-ReleaseAssets)) {
                $received[$asset.name] = $asset
              }
              $batch = @(foreach ($path in $batch) {
                $name = [IO.Path]::GetFileName($path)
                $asset = $received[$name]
                if ($asset.state -eq 'uploaded' -and $asset.digest -eq $hashes[$name]) { continue }
                if ($asset) {
                  gh api "$endpoint/assets/$($asset.id)" --method DELETE | Out-Null
                  if ($LASTEXITCODE) { throw "Could not remove interrupted draft asset: $name" }
                }
                $path
              })
            }
            if ($batch.Count) { throw "Could not upload $($batch.Count) draft assets starting at position $i. Re-run the release job to resume." }
          }
          $verified = @(Get-ReleaseAssets)
          if ($verified.Count -ne $files.Count -or ($verified | Where-Object { $_.state -ne 'uploaded' -or !$hashes.ContainsKey($_.name) -or $_.digest -ne $hashes[$_.name] })) { throw 'Draft assets do not match the verified package' }
          if (!$release.draft) { return }
          gh api "$endpoint/$releaseId" --method PATCH -F draft=false -f make_latest=true --jq .html_url
          if ($LASTEXITCODE) { throw 'Could not publish release' }
