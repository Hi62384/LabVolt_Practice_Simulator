name: NPC native regressions
on:
  push:
    branches: [dev/npc-realtime-overhaul-20261128]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npc-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install local protocol fixture and Godot Mono
        shell: pwsh
        run: |
          python -m pip install aiohttp
          if ($LASTEXITCODE) { throw 'Fixture installation failed' }
          $engineDir = "$env:RUNNER_TEMP/godot"
          New-Item -ItemType Directory -Force $engineDir | Out-Null
          $engine = "Godot_v$env:GODOT_VERSION-stable_mono_win64"
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          curl.exe --fail --location --retry 3 --output "$engineDir/engine.zip" "$base/$engine.zip"
          if ($LASTEXITCODE) { throw 'Godot download failed' }
          Expand-Archive -Path "$engineDir/engine.zip" -DestinationPath $engineDir
          "GODOT=$engineDir/$engine/$($engine)_console.exe" >> $env:GITHUB_ENV
      - name: Build and import
        id: build
        shell: pwsh
        run: |
          dotnet build CollegeSimulator.sln --configuration Debug
          if ($LASTEXITCODE) { throw 'C# build failed' }
          & $env:GODOT --headless --path . --import
          if ($LASTEXITCODE) { throw 'Godot import failed' }
      - name: Targeted native streaming and UI regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/npc-logs" | Out-Null
          python tests/campus/academics/run_voice_pipeline_tests.py --godot "$env:GODOT" --logs "$env:RUNNER_TEMP/npc-logs/targeted" --cases test_voice_meter_input test_subtitle_audibility test_realtime_stream_buffer test_character_voice_studio test_character_worldviews
          if ($LASTEXITCODE) { throw 'Targeted regression failure' }
      - name: Native local provider WebSocket and HTTP tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          python tests/campus/ai/run_voice_provider_tests.py --godot "$env:GODOT" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/npc-logs/provider.log"
          if ($LASTEXITCODE) { throw 'Provider protocol regression failure' }
      - name: Full NPC voice pipeline regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          python tests/campus/academics/run_voice_pipeline_tests.py --godot "$env:GODOT" --logs "$env:RUNNER_TEMP/npc-logs/full"
          if ($LASTEXITCODE) { throw 'Voice pipeline regression failure' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-regression-logs
          path: ${{ runner.temp }}/npc-logs/
          if-no-files-found: warn
